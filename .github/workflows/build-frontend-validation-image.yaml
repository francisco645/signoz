# Builds an nginx image with the Service Map frontend on top of v0.145.0, to run
# next to an existing v0.145.0 SigNoz. Lives on the fork's validation branch only.
name: build-frontend-validation-image

on:
  push:
    branches: [validation/frontend-v0.145.0]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: build frontend
        working-directory: frontend
        env:
          VITE_VERSION: v0.145.0-service-map
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/signoz-frontend-validation
          tags: |
            type=raw,value=service-map-v0.145.0
            type=sha,prefix=service-map-v0.145.0-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend-validation/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
